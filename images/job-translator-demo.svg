  <text x="506" y="461" fill="#475569" font-size="15" font-family="Inter, Arial, sans-serif">Week 1: review SQL basics and recreate one dashboard project.</text>
  <rect x="488" y="486" width="616" height="36" rx="12" fill="white"/>
  <text x="506" y="509" fill="#475569" font-size="15" font-family="Inter, Arial, sans-serif">Week 1: practice explaining findings to a non-technical audience.</text>
