  <text x="118" y="502" fill="#7F1D1D" font-size="13" font-family="Inter, Arial, sans-serif">The posting mixes tools,</text>
  <text x="118" y="520" fill="#7F1D1D" font-size="13" font-family="Inter, Arial, sans-serif">tasks, and expectations all together.</text>

  <rect x="462" y="160" width="668" height="188" rx="20" fill="#EEF4FF"/>
