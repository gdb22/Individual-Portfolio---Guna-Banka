  <text x="488" y="246" fill="#334155" font-size="20" font-family="Inter, Arial, sans-serif">You need SQL, dashboards, and strong communication</text>
  <text x="488" y="278" fill="#334155" font-size="20" font-family="Inter, Arial, sans-serif">to explain findings clearly to non-technical teams.</text>
